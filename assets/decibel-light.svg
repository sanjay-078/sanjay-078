<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-labelledby="db-light-t db-light-d">
  <title id="db-light-t">DECIBEL — Operations Engine &amp; CRM Architecture (Light Edition)</title>
  <desc id="db-light-d">Deterministic multi-department workflow coordinator with 19 passing end-to-end test suites across 3 departments.</desc>
  <defs>
    <!-- Light Architectural Canvas Gradients -->
    <linearGradient id="db-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <linearGradient id="db-card-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>

    <linearGradient id="db-stream-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <pattern id="db-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FDE68A" stroke-width="0.7" stroke-opacity="0.8"/>
    </pattern>

    <clipPath id="db-clip-light">
      <rect x="0" y="0" width="920" height="280" rx="14"/>
    </clipPath>
  </defs>

  <style>
    @keyframes dbPacketRun { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
    @keyframes dbStateCycle { 0%, 100% { stroke: #D97706; } 50% { stroke: #059669; } }
    @keyframes dbTrackPulse { 0% { transform: scaleX(0.72); opacity: 0.5; } 50% { transform: scaleX(1); opacity: 0.95; } 100% { transform: scaleX(0.72); opacity: 0.5; } }
    @keyframes dbCheckPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); filter: drop-shadow(0 0 5px #059669); } }

    .db-wire { stroke-dasharray: 6 12; animation: dbPacketRun 1.6s linear infinite; }
    .db-state-node { animation: dbStateCycle 3s ease-in-out infinite; }
    .db-track-bar { animation: dbTrackPulse 2.4s ease-in-out infinite; transform-origin: left center; }
    .db-test-badge { animation: dbCheckPop 2.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

    @media (prefers-reduced-motion: reduce) {
      *, .db-wire, .db-state-node, .db-track-bar, .db-test-badge {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>

  <g clip-path="url(#db-clip-light)">
    <!-- Canvas Fill & Grid -->
    <rect width="920" height="280" fill="url(#db-bg-light)"/>
    <rect width="920" height="280" fill="url(#db-grid-light)"/>

    <!-- ======================================================== -->
    <!-- HEADER BAR: TITLE, KICKER & PROMINENT VERIFIED OUTCOME   -->
    <!-- ======================================================== -->
    <g transform="translate(32, 24)">
      <!-- System Tag -->
      <rect width="180" height="22" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
      <circle cx="9" cy="11" r="3" fill="#D97706"/>
      <text x="18" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1" fill="#B45309">SYSTEM 04 // OPERATIONS</text>

      <!-- Project Title & Subtitle -->
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.8" fill="#0F172A">
        DECIBEL
      </text>
      <text x="136" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="500" fill="#475569">
        Deterministic Multi-Department Operations Engine &amp; Reactive CRM
      </text>

      <!-- Prominent Verified Outcome Badge -->
      <g transform="translate(610, 0)">
        <rect width="246" height="34" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
        <text x="14" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#B45309">3 DEPTS · 19/19 E2E PASS</text>
        <rect x="186" y="7" width="50" height="20" rx="3" fill="#D1FAE5" stroke="#10B981" stroke-width="0.8"/>
        <text x="194" y="21" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#047857">100%</text>
      </g>
    </g>

    <!-- Hairline Divider -->
    <line x1="32" y1="84" x2="888" y2="84" stroke="#FDE68A" stroke-width="1"/>

    <!-- ======================================================== -->
    <!-- 4 BALANCED ARCHITECTURAL STAGES (x=32, 250, 468, 686)     -->
    <!-- ======================================================== -->

    <!-- STAGE 1: INTAKE & TICKETING -->
    <g transform="translate(32, 98)">
      <rect width="194" height="136" rx="8" fill="url(#db-card-light)" stroke="#FCD34D" stroke-width="1"/>
      <rect x="1" y="1" width="192" height="26" rx="7" fill="#FEF3C7"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">01 // INTAKE &amp; TICKETING</text>

      <!-- Multi-Channel Queue Stack Visual -->
      <g transform="translate(14, 46)">
        <rect width="48" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>

        <!-- Queue Item Strips with Priority Indicators -->
        <rect x="6" y="8" width="36" height="9" rx="2" fill="#FEE2E2"/>
        <circle cx="11" cy="12.5" r="2.2" fill="#DC2626"/>
        <text x="17" y="15.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#B91C1C">P0</text>
        <line x1="28" y1="12.5" x2="38" y2="12.5" stroke="#F59E0B" stroke-width="1"/>

        <rect x="6" y="20" width="36" height="9" rx="2" fill="#FEF3C7"/>
        <circle cx="11" cy="24.5" r="2.2" fill="#D97706"/>
        <text x="17" y="27.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#B45309">P1</text>
        <line x1="28" y1="24.5" x2="36" y2="24.5" stroke="#F59E0B" stroke-width="1"/>

        <rect x="6" y="32" width="36" height="9" rx="2" fill="#D1FAE5"/>
        <circle cx="11" cy="36.5" r="2.2" fill="#059669"/>
        <text x="17" y="39.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700" fill="#047857">P2</text>
        <line x1="28" y1="36.5" x2="35" y2="36.5" stroke="#059669" stroke-width="1"/>
      </g>

      <g transform="translate(70, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Omnichannel</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#475569">Voice, email &amp; web</text>
        <rect x="0" y="40" width="112" height="18" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="6" y="53" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">SLA PRIORITY</text>
      </g>

      <!-- Status Indicator -->
      <g transform="translate(14, 114)">
        <circle cx="4" cy="4" r="3" fill="#D97706"/>
        <text x="14" y="7.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#334155">FIFO Priority Dispatch</text>
      </g>
    </g>

    <!-- PIPELINE CONDUIT 1 -> 2 -->
    <g transform="translate(226, 166)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#FCD34D" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="url(#db-stream-light)" stroke-width="1.5" class="db-wire"/>
      <polygon points="20,-3.5 24,0 20,3.5" fill="#D97706"/>
    </g>

    <!-- STAGE 2: DETERMINISTIC FSM -->
    <g transform="translate(250, 98)">
      <rect width="194" height="136" rx="8" fill="url(#db-card-light)" stroke="#FCD34D" stroke-width="1"/>
      <rect x="1" y="1" width="192" height="26" rx="7" fill="#FEF3C7"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">02 // DETERMINISTIC FSM</text>

      <!-- State Machine Node Graph Visual -->
      <g transform="translate(14, 46)">
        <rect width="48" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>

        <!-- Nodes -->
        <circle cx="15" cy="15" r="5.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" class="db-state-node"/>
        <text x="15" y="17.5" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" text-anchor="middle" fill="#B45309">S1</text>

        <circle cx="33" cy="15" r="5.5" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2" class="db-state-node"/>
        <text x="33" y="17.5" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" text-anchor="middle" fill="#B45309">S2</text>

        <circle cx="24" cy="35" r="5.5" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/>
        <text x="24" y="37.5" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" text-anchor="middle" fill="#047857">OK</text>

        <!-- Directed Edges -->
        <line x1="21" y1="15" x2="27" y2="15" stroke="#D97706" stroke-width="1"/>
        <line x1="17" y1="20" x2="22" y2="30" stroke="#D97706" stroke-width="1"/>
        <line x1="31" y1="20" x2="26" y2="30" stroke="#059669" stroke-width="1"/>
      </g>

      <g transform="translate(70, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">State Machine</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#475569">Atomic transitions</text>
        <rect x="0" y="40" width="112" height="18" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="6" y="53" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">MUTEX LOCKS</text>
      </g>

      <!-- Status Indicator -->
      <g transform="translate(14, 114)">
        <circle cx="4" cy="4" r="3" fill="#D97706"/>
        <text x="14" y="7.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#334155">Zero Race Conditions</text>
      </g>
    </g>

    <!-- PIPELINE CONDUIT 2 -> 3 -->
    <g transform="translate(444, 166)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#FCD34D" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="url(#db-stream-light)" stroke-width="1.5" class="db-wire"/>
      <polygon points="20,-3.5 24,0 20,3.5" fill="#D97706"/>
    </g>

    <!-- STAGE 3: 3 SYNCHRONIZED DEPARTMENTS -->
    <g transform="translate(468, 98)">
      <rect width="194" height="136" rx="8" fill="url(#db-card-light)" stroke="#FCD34D" stroke-width="1"/>
      <rect x="1" y="1" width="192" height="26" rx="7" fill="#FEF3C7"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">03 // 3 DEPARTMENTS</text>

      <!-- 3 Departmental Rails Visual -->
      <g transform="translate(14, 46)">
        <rect width="48" height="50" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>

        <!-- Lane 1: Sales / Commercial -->
        <rect x="5" y="8" width="38" height="8" rx="2" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.6"/>
        <rect x="7" y="10" width="22" height="4" rx="1.5" fill="#D97706" class="db-track-bar"/>

        <!-- Lane 2: Operations Fulfillment -->
        <rect x="5" y="21" width="38" height="8" rx="2" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.6"/>
        <rect x="7" y="23" width="30" height="4" rx="1.5" fill="#F59E0B" class="db-track-bar"/>

        <!-- Lane 3: Support Care -->
        <rect x="5" y="34" width="38" height="8" rx="2" fill="#D1FAE5" stroke="#10B981" stroke-width="0.6"/>
        <rect x="7" y="36" width="26" height="4" rx="1.5" fill="#059669" class="db-track-bar"/>
      </g>

      <g transform="translate(70, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Synchronized</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#475569">Commercial · Ops · Care</text>
        <rect x="0" y="40" width="112" height="18" rx="3" fill="#FEF3C7" stroke="#FCD34D" stroke-width="0.8"/>
        <text x="6" y="53" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">SHARED CONTEXT</text>
      </g>

      <!-- Status Indicator -->
      <g transform="translate(14, 114)">
        <circle cx="4" cy="4" r="3" fill="#059669"/>
        <text x="14" y="7.5" font-family="ui-monospace, monospace" font-size="10.5" fill="#334155">Real-time Cross-Sync</text>
      </g>
    </g>

    <!-- PIPELINE CONDUIT 3 -> 4 -->
    <g transform="translate(662, 166)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#FCD34D" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="url(#db-stream-light)" stroke-width="1.5" class="db-wire"/>
      <polygon points="20,-3.5 24,0 20,3.5" fill="#059669"/>
    </g>

    <!-- STAGE 4: VERIFIED 19/19 E2E TEST SUITE -->
    <g transform="translate(686, 98)">
      <rect width="202" height="136" rx="8" fill="url(#db-card-light)" stroke="#059669" stroke-width="1.2"/>
      <rect x="1" y="1" width="200" height="26" rx="7" fill="#D1FAE5"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#047857">04 // E2E VERIFICATION</text>

      <!-- Playwright Pass Card Visual -->
      <g transform="translate(14, 46)">
        <rect width="174" height="44" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1"/>

        <!-- Glowing Checkmark Shield -->
        <g class="db-test-badge" transform="translate(24, 22)">
          <circle cx="0" cy="0" r="12" fill="#059669"/>
          <polyline points="-5,-1 -1,4 6,-3" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <text x="46" y="21" font-family="ui-monospace, monospace" font-size="14.5" font-weight="800" fill="#047857">19/19 PASS</text>
        <text x="46" y="34" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#065F46">Playwright E2E</text>
      </g>

      <!-- Status Indicator -->
      <g transform="translate(14, 114)">
        <circle cx="4" cy="4" r="3" fill="#059669"/>
        <text x="14" y="7.5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#047857">0 Regressions · Production Audited</text>
      </g>
    </g>

    <!-- ======================================================== -->
    <!-- ARCHITECTURAL SPECIFICATION FOOTER BAR                   -->
    <!-- ======================================================== -->
    <g transform="translate(32, 252)">
      <line x1="0" y1="0" x2="856" y2="0" stroke="#FDE68A" stroke-width="1"/>
      <text x="0" y="16" font-family="ui-monospace, monospace" font-size="10.5" font-weight="500" fill="#475569">
        ARCHITECTURE // DETERMINISTIC FSM · 3 DEPARTMENTAL QUEUES · 19 PLAYWRIGHT E2E SUITES · POSTGRESQL
      </text>
      <text x="766" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#B45309">
        CASE STUDY ↗
      </text>
    </g>
  </g>

  <!-- Exterior Frame Border -->
  <rect x="0.5" y="0.5" width="919" height="279" rx="13.5" fill="none" stroke="#FCD34D" stroke-width="1"/>
</svg>
