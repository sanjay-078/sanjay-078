<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-labelledby="fb-dark-t fb-dark-d">
  <title id="fb-dark-t">FIREBLADE — Mobile-to-Cloud Telephony Telemetry Architecture</title>
  <desc id="fb-dark-d">Production edge-to-cloud telemetry pipeline deployed across 20 employee devices in daily business operations.</desc>
  <defs>
    <!-- Dark Canvas Background Gradients -->
    <linearGradient id="fb-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F"/>
      <stop offset="60%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <linearGradient id="fb-card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09101C" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="fb-stream-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="fb-glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="fb-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3"/>
    </pattern>

    <clipPath id="fb-clip-dark">
      <rect x="0" y="0" width="920" height="280" rx="14"/>
    </clipPath>
  </defs>

  <style>
    @keyframes fbPacketRun { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
    @keyframes fbRadioPulse { 0% { r: 8; opacity: 0.9; } 100% { r: 22; opacity: 0; } }
    @keyframes fbStatusBlink { 0%, 100% { fill: #2DD4BF; } 50% { fill: #38BDF8; } }
    @keyframes fbTimelineStep { 0%, 20% { transform: translateX(0); } 30%, 50% { transform: translateX(28px); } 60%, 80% { transform: translateX(56px); } 90%, 100% { transform: translateX(84px); } }

    .fb-wire { stroke-dasharray: 6 12; animation: fbPacketRun 1.6s linear infinite; }
    .fb-radio { animation: fbRadioPulse 2.2s cubic-bezier(0.1, 0.7, 0.3, 1) infinite; }
    .fb-lamp { animation: fbStatusBlink 2.4s ease-in-out infinite; }
    .fb-step-cursor { animation: fbTimelineStep 6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, .fb-wire, .fb-radio, .fb-lamp, .fb-step-cursor {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>

  <g clip-path="url(#fb-clip-dark)">
    <!-- Canvas Fill & Grid -->
    <rect width="920" height="280" fill="url(#fb-bg-dark)"/>
    <rect width="920" height="280" fill="url(#fb-grid-dark)"/>

    <!-- ======================================================== -->
    <!-- HEADER BAR: TITLE, KICKER & PROMINENT VERIFIED OUTCOME   -->
    <!-- ======================================================== -->
    <g transform="translate(32, 24)">
      <!-- System Tag -->
      <rect width="180" height="22" rx="4" fill="#0C1527" stroke="#1E293B" stroke-width="1"/>
      <circle cx="9" cy="11" r="3" fill="#2DD4BF" filter="url(#fb-glow-subtle)"/>
      <text x="18" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1" fill="#38BDF8">SYSTEM 01 // TELEMETRY</text>

      <!-- Project Title & Subtitle -->
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.8" fill="#F8FAFC">
        FIREBLADE
      </text>
      <text x="150" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" font-weight="500" fill="#94A3B8">
        Mobile Edge Telemetry &amp; Call Intelligence Pipeline
      </text>

      <!-- Prominent Verified Outcome Badge (Clear, Large, High-Contrast) -->
      <g transform="translate(630, 0)">
        <rect width="226" height="34" rx="6" fill="#0B1322" stroke="#0284C7" stroke-width="1.2"/>
        <text x="14" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800" fill="#38BDF8">20 ACTIVE PHONES</text>
        <rect x="170" y="7" width="44" height="20" rx="3" fill="#10B981" fill-opacity="0.25"/>
        <text x="178" y="21" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#34D399">DAILY</text>
      </g>
    </g>

    <!-- Hairline Divider -->
    <line x1="32" y1="84" x2="888" y2="84" stroke="#1E293B" stroke-width="0.8"/>

    <!-- ======================================================== -->
    <!-- 4 BALANCED ARCHITECTURAL STAGES (x=32, 250, 468, 686)     -->
    <!-- ======================================================== -->

    <!-- STAGE 1: ANDROID EDGE FLEET -->
    <g transform="translate(32, 98)">
      <rect width="194" height="136" rx="8" fill="url(#fb-card-dark)" stroke="#1E293B" stroke-width="1"/>
      <rect x="1" y="1" width="192" height="26" rx="7" fill="#0E1726"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#64748B">01 // EDGE FLEET</text>

      <!-- Phone Silhouette with Radio Pulse -->
      <g transform="translate(18, 44)">
        <rect width="36" height="60" rx="6" fill="#070D18" stroke="#38BDF8" stroke-width="1.4"/>
        <rect x="8" y="6" width="20" height="40" rx="2" fill="#0F172A"/>
        <circle cx="18" cy="52" r="2.5" fill="#334155"/>
        <circle cx="18" cy="22" r="4.5" fill="#2DD4BF" class="fb-lamp"/>
        <circle cx="18" cy="22" r="14" fill="none" stroke="#38BDF8" stroke-width="1.5" class="fb-radio"/>
      </g>

      <g transform="translate(72, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Kotlin Service</text>
        <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Foreground Daemon</text>
        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38BDF8">Call State Listener</text>
      </g>
    </g>

    <!-- PIPELINE CONDUIT 1 -> 2 -->
    <g transform="translate(226, 166)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#1E293B" stroke-width="2"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="url(#fb-stream-dark)" stroke-width="2" class="fb-wire"/>
      <circle cx="12" cy="0" r="3" fill="#38BDF8"/>
    </g>

    <!-- STAGE 2: OFFLINE RING BUFFER -->
    <g transform="translate(250, 98)">
      <rect width="194" height="136" rx="8" fill="url(#fb-card-dark)" stroke="#1E293B" stroke-width="1"/>
      <rect x="1" y="1" width="192" height="26" rx="7" fill="#0E1726"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#64748B">02 // OFFLINE BUFFER</text>

      <!-- Database Drum Icon -->
      <g transform="translate(18, 48)">
        <path d="M 0 8 C 0 3 14 0 28 0 C 42 0 56 3 56 8 L 56 42 C 56 47 42 50 28 50 C 14 50 0 47 0 42 Z" fill="#080F1D" stroke="#0284C7" stroke-width="1.2"/>
        <path d="M 0 8 C 0 13 14 16 28 16 C 42 16 56 13 56 8" fill="none" stroke="#0284C7" stroke-width="1.2"/>
        <path d="M 0 22 C 0 27 14 30 28 30 C 42 30 56 27 56 22" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="2 3"/>
        <circle cx="28" cy="8" r="3" fill="#38BDF8"/>
      </g>

      <g transform="translate(86, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">SQLite Queue</text>
        <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Zero Event Loss</text>
        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#2DD4BF">Auto Retry Backoff</text>
      </g>
    </g>

    <!-- PIPELINE CONDUIT 2 -> 3 -->
    <g transform="translate(444, 166)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#1E293B" stroke-width="2"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="url(#fb-stream-dark)" stroke-width="2" class="fb-wire"/>
      <circle cx="12" cy="0" r="3" fill="#2DD4BF"/>
    </g>

    <!-- STAGE 3: FASTAPI TLS GATEWAY -->
    <g transform="translate(468, 98)">
      <rect width="194" height="136" rx="8" fill="url(#fb-card-dark)" stroke="#1E293B" stroke-width="1"/>
      <rect x="1" y="1" width="192" height="26" rx="7" fill="#0E1726"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#64748B">03 // FASTAPI GATEWAY</text>

      <!-- Shield / TLS Lock Graphic -->
      <g transform="translate(18, 48)">
        <rect width="48" height="48" rx="7" fill="#070D1A" stroke="#2DD4BF" stroke-width="1.2"/>
        <path d="M 24 10 L 36 14 L 36 24 C 36 32 24 38 24 38 C 24 38 12 32 12 24 L 12 14 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <circle cx="24" cy="23" r="2.5" fill="#2DD4BF"/>
      </g>

      <g transform="translate(78, 46)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">TLS 1.3 Ingest</text>
        <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">HMAC Signature</text>
        <text x="0" y="48" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#38BDF8">Pydantic Guard</text>
      </g>
    </g>

    <!-- PIPELINE CONDUIT 3 -> 4 -->
    <g transform="translate(662, 166)">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#1E293B" stroke-width="2"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="url(#fb-stream-dark)" stroke-width="2" class="fb-wire"/>
      <circle cx="12" cy="0" r="3" fill="#38BDF8"/>
    </g>

    <!-- STAGE 4: CALL TIMELINE & NORMALIZATION -->
    <g transform="translate(686, 98)">
      <rect width="202" height="136" rx="8" fill="url(#fb-card-dark)" stroke="#0284C7" stroke-width="1.2"/>
      <rect x="1" y="1" width="200" height="26" rx="7" fill="#0C1527"/>
      <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">04 // CALL NORMALIZER</text>

      <!-- Authentic Call State Timeline Graphic (Not Stock Bars) -->
      <g transform="translate(16, 46)">
        <rect width="170" height="36" rx="4" fill="#070D18" stroke="#1E293B" stroke-width="0.8"/>
        <!-- State Track Line -->
        <line x1="16" y1="18" x2="154" y2="18" stroke="#334155" stroke-width="2"/>
        <!-- State Milestone Nodes -->
        <circle cx="28" cy="18" r="4" fill="#38BDF8"/>
        <circle cx="68" cy="18" r="4" fill="#38BDF8"/>
        <circle cx="108" cy="18" r="4" fill="#2DD4BF"/>
        <circle cx="144" cy="18" r="5" fill="#10B981"/>
        <!-- Moving Stage Cursor -->
        <g class="fb-step-cursor">
          <circle cx="28" cy="18" r="7" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
        </g>
      </g>

      <g transform="translate(16, 96)">
        <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">20 Devices Deployed</text>
        <text x="0" y="28" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#10B981">● Normalized Telemetry</text>
      </g>
    </g>

    <!-- Footer Technical Specs Bar -->
    <g transform="translate(32, 256)">
      <line x1="0" y1="0" x2="856" y2="0" stroke="#1E293B" stroke-width="0.8"/>
      <text x="0" y="15" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">ARCHITECTURE // KOTLIN TELEPHONY DAEMON · SQLITE RING BUFFER · FASTAPI REVERSE PROXY · POSTGRESQL</text>
      <text x="770" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38BDF8">CASE STUDY ↗</text>
    </g>
  </g>

  <!-- Exterior Frame Border -->
  <rect x="0.5" y="0.5" width="919" height="279" rx="13.5" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
